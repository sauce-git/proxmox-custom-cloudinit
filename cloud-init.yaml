#cloud-config
users:
  - name: sauce
    ssh-authorized-keys:
      # - your ssh key here
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: false
    # passwd: "your encrypted password here"

ssh_pwauth: true
chpasswd:
  expire: false

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent
runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
